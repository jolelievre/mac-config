# Shared rtk config — symlinked into place by install/16-claude-config.sh.
#
# rtk reads its config from dirs::config_dir(); on macOS that is
#   ~/Library/Application Support/rtk/config.toml
# The install script wires a two-hop symlink chain that resolves to this file:
#   ~/Library/Application Support/rtk/config.toml
#     -> ~/.config/rtk/config.toml
#       -> <repo>/claude/rtk-config.toml   (this file)
#
# Edit here and the change applies on every device sharing this repo.

[tracking]
enabled = true
history_days = 90

[display]
colors = true
emoji = true
max_width = 120

[filters]
ignore_dirs = [
    ".git",
    "node_modules",
    "target",
    "__pycache__",
    ".venv",
    "vendor",
]
ignore_files = [
    "*.lock",
    "*.min.js",
    "*.min.css",
]

[tee]
enabled = true
mode = "failures"
max_files = 20
max_file_size = 1048576

[telemetry]
enabled = true
consent_given = true

[hooks]
# Commands rtk should NOT rewrite. Each entry is an anchored word-boundary
# prefix: "npm run" matches `npm run ...` but not `npm install`;
# "npx playwright" matches that wrapper but not `npx tsc`.
exclude_commands = ["curl", "playwright", "npx playwright", "npm run"]
transparent_prefixes = []

[limits]
grep_max_results = 200
grep_max_per_file = 25
status_max_files = 15
status_max_untracked = 10
passthrough_max_chars = 2000
